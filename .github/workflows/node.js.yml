name: Node.js CI

on: [push, pull_request]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  # Formatting is its own job, not part of `check`, so a Prettier nit can never
  # mask (or block) a real type/build failure — the two report independently. A
  # code-only pre-commit hook (`.githooks/pre-commit`) keeps this
  # green without thought; this is the backstop for commits made without it.
  # OS-independent, so one runner is enough.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check

  # The Playwright e2e suite. Exists because a spec sat silently red for four
  # days — nothing ran it automatically, so a real regression shipped unnoticed
  # (fixed in 1009a486). This job closes that hole: every push/PR now runs it.
  # One runner (ubuntu-latest) is deliberate — this job's coverage is browser
  # ENGINE (chromium + webkit, the JavaScriptCore vs V8 split the WASM codecs
  # care about), not the OS. OS coverage is the build matrix's job.
  # Pinned to 24.04 rather than ubuntu-latest: on 2026-11-09 ubuntu-latest
  # was Ubuntu 26.04, where `playwright install` refuses Chromium. Move to
  # ubuntu-latest again once the Playwright release in use supports it.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Cache the downloaded browser binaries, keyed on the Playwright version so
      # a version bump busts the cache. playwright.config.ts's webServer builds
      # and previews the app itself, so there's no separate build step here.
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
